name: CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Test with race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "/tmp/hoplane-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/hoplane
      # Source mode sees go-selfupdate's unused OpenPGP validator; scan the
      # unstripped target binary to check the code actually linked into it.
      - name: Vulnerability scan ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary "/tmp/hoplane-${{ matrix.goos }}-${{ matrix.goarch }}"
